kind = "mobile"
previewPath = "/"
title = "Survive The Shift"
version = "1.0.0"
id = "artifacts/survive-the-shift"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/survive-the-shift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/survive-the-shift", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/survive-the-shift", "run", "serve" ]

[services.env]
PORT = "5000"
BASE_PATH = "/"
